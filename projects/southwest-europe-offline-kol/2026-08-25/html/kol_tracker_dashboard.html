<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>西南欧线下市场marketing追踪底表</title>
  <style>
    :root {
      --bg: #f7f2e9;
      --panel: #fffdf8;
      --ink: #24303a;
      --muted: #66717f;
      --line: #e7ddce;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at left top, rgba(42, 123, 87, 0.1), transparent 24%),
        radial-gradient(circle at right top, rgba(79, 111, 208, 0.1), transparent 18%),
        linear-gradient(180deg, #fbf8f1 0%, var(--bg) 100%);
    }
    .page {
      max-width: 1240px;
      margin: 0 auto;
      padding: 34px 24px 56px;
    }
    .hero {
      padding: 30px;
      border-radius: 28px;
      background: linear-gradient(135deg, #183d47 0%, #2d5b5f 54%, #587652 100%);
      color: #fffef9;
      box-shadow: 0 24px 54px rgba(24, 61, 71, 0.18);
    }
    .hero h1 {
      margin: 0 0 12px;
      font-size: 34px;
      line-height: 1.15;
    }
    .hero p {
      margin: 0;
      line-height: 1.7;
      color: rgba(255, 254, 249, 0.86);
    }
    .hero-meta {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.13);
      font-size: 13px;
    }
    .section-title {
      margin: 34px 0 14px;
      font-size: 21px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }
    .country-card {
      position: relative;
      display: block;
      color: inherit;
      text-decoration: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 16px 36px rgba(100, 82, 44, 0.08);
      overflow: hidden;
    }
    .country-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 8px;
      background: var(--accent);
    }
    .country-badge {
      display: inline-block;
      margin-bottom: 14px;
      padding: 6px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 14%, white);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
    }
    .country-card h2 {
      margin: 0 0 10px;
      font-size: 28px;
    }
    .country-card p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.65;
    }
    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 13px;
      color: #596471;
    }
    .card-meta span {
      padding: 8px 10px;
      border-radius: 999px;
      background: #f3ede2;
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <h1>西南欧线下市场marketing追踪底表</h1>
      <p>首页按国家进入，国家页按月份或批次查看活动表。</p>
      <div class="hero-meta">
        <span class="chip">最近更新：2026-08-05</span>
        <span class="chip">意大利 / 法国 / 德国</span>
      </div>
    </section>
    <h2 class="section-title">国家入口</h2>
    <section class="grid">
        <a class="country-card" href="./italy.html" style="--accent:#bb6a3a">
          <div class="country-badge">国家板块</div>
          <h2>意大利</h2>
          <p>点进去查看该国家每个月的活动表和追踪进度。</p>
          <div class="card-meta">
            <span>16 条记录</span>
            <span>2 个活动区块</span>
          </div>
        </a>
      
        <a class="country-card" href="./france.html" style="--accent:#4f6fd0">
          <div class="country-badge">国家板块</div>
          <h2>法国</h2>
          <p>点进去查看该国家每个月的活动表和追踪进度。</p>
          <div class="card-meta">
            <span>11 条记录</span>
            <span>1 个活动区块</span>
          </div>
        </a>
      
        <a class="country-card" href="./germany.html" style="--accent:#2a7b57">
          <div class="country-badge">国家板块</div>
          <h2>德国</h2>
          <p>点进去查看该国家每个月的活动表和追踪进度。</p>
          <div class="card-meta">
            <span>0 条记录</span>
            <span>0 个活动区块</span>
          </div>
        </a>
      </section>
  </div>
</body>
</html>
