<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>德国 - 西南欧线下市场marketing追踪底表</title>
  <style>
    :root {
      --bg: #f7f2e9;
      --panel: #fffdf8;
      --ink: #24303a;
      --muted: #697482;
      --line: #e7ddce;
      --accent: #2a7b57;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at left top, color-mix(in srgb, var(--accent) 16%, white), transparent 20%),
        linear-gradient(180deg, #fbf8f1 0%, var(--bg) 100%);
    }
    .page {
      max-width: 1380px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .back-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .page-title {
      padding: 26px 28px;
      border-radius: 28px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, #173d47), #173d47 62%, #355963);
      color: #fffef9;
      box-shadow: 0 22px 50px rgba(24, 61, 71, 0.16);
    }
    .page-title h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }
    .page-title p {
      margin: 0;
      line-height: 1.65;
      color: rgba(255, 254, 249, 0.88);
    }
    .month-nav {
      margin: 18px 0 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .month-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 14px;
      box-shadow: 0 8px 20px rgba(82, 68, 38, 0.06);
    }
    .month-chip strong,
    .meta-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: #f3ede2;
      color: #586270;
      font-size: 13px;
    }
    .month-section + .month-section { margin-top: 30px; }
    .month-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .month-header h2 {
      margin: 0 0 8px;
      font-size: 26px;
    }
    .month-header p {
      margin: 0;
      color: var(--muted);
    }
    .month-stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .month-stats span {
      padding: 8px 12px;
      border-radius: 999px;
      background: #f3ede2;
      color: #586270;
      font-size: 13px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 14px 34px rgba(90, 74, 43, 0.07);
    }
    .campaign-meta {
      margin-bottom: 14px;
    }
    .campaign-note {
      margin-top: 10px;
      line-height: 1.7;
      color: var(--muted);
    }
    .meta-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }
    .target-board {
      margin-bottom: 16px;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }
    .summary-card {
      padding: 16px;
      border-radius: 20px;
      background: #fbf7ef;
      border: 1px solid var(--line);
    }
    .summary-card .label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }
    .summary-card .value {
      font-size: 28px;
      font-weight: 700;
    }
    .summary-card .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }
    .budget-track {
      margin-top: 10px;
      height: 10px;
      background: #eee4d2;
      border-radius: 999px;
      overflow: hidden;
    }
    .budget-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, white));
    }
    .summary-metric {
      margin-top: 12px;
      padding: 12px 12px 10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.62);
      border: 1px dashed color-mix(in srgb, var(--accent) 28%, #d9cdb8);
    }
    .summary-metric-title {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .summary-metric-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
      font-size: 12px;
      color: var(--muted);
    }
    .summary-metric-head strong {
      color: var(--ink);
      font-size: 18px;
      line-height: 1.1;
    }
    .target-table-wrap,
    .table-scroll {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    .target-table th,
    .target-table td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    .target-table th {
      color: var(--muted);
      font-weight: 600;
      font-size: 13px;
    }
    .progress-cell {
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .progress-icons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .target-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      color: #cbbfae;
      font-size: 18px;
      line-height: 1;
      font-weight: 800;
      transition: transform 0.15s ease;
    }
    .target-slot.kol {
      color: #c9d5ff;
    }
    .target-slot.ugc {
      color: #c5e2d0;
    }
    .target-slot.filled.kol {
      color: #365ccf;
      transform: scale(0.92);
    }
    .target-slot.filled.ugc {
      color: #25714f;
      transform: scale(0.92);
    }
    .target-slot.warning {
      color: #d7a926;
    }
    .progress-names {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .marker {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #f5efe5;
      color: #4b5563;
      border: 1px solid transparent;
      font-size: 11px;
      line-height: 1.2;
    }
    .marker.kol {
      background: #eef2ff;
      color: #365ccf;
    }
    .marker.ugc {
      background: #e9f5ee;
      color: #25714f;
    }
    .marker.warning {
      background: #fff5cf;
      border-color: #f0d574;
      color: #8a5b00;
    }
    .shape {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      flex: 0 0 auto;
    }
    .marker-name {
      max-width: 112px;
      font-size: 11px;
      line-height: 1.2;
      word-break: break-word;
    }
    .tracker-table {
      min-width: 1820px;
      font-size: 13px;
    }
    .tracker-table th,
    .tracker-table td {
      border: 1px solid var(--line);
      padding: 10px;
      vertical-align: top;
      background: #fffef9;
    }
    .tracker-table thead tr:first-child th {
      text-align: center;
      font-size: 14px;
      color: #364152;
    }
    .group-head-base { background: #f7f1e6; }
    .group-head-pre { background: #dff0df; }
    .group-head-post { background: #dce8f7; }
    .nowrap { white-space: nowrap; }
    .wrap {
      white-space: pre-line;
      word-break: break-word;
      min-width: 180px;
    }
    .link a {
      color: #1f5bd8;
      text-decoration: none;
      word-break: break-all;
    }
    .status {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 12px;
      background: #f1eee8;
      color: #45505c;
    }
    .status.published {
      background: #e4f4ea;
      color: #1e6e4d;
    }
    .status.confirmed {
      background: #e7efff;
      color: #365ccf;
    }
    .status.unknown {
      background: #fdf0d4;
      color: #946200;
    }
    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 58px;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
      color: white;
    }
    .rank-1 { background: #d25b54; }
    .rank-2 { background: #df8a37; }
    .rank-3 { background: #d8b13f; color: #5a4200; }
    .rank-4 { background: #5f88d8; }
    .rank-5 { background: #6fa0d1; }
    .metric-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .metric-block small {
      color: var(--muted);
    }
    .empty {
      padding: 20px;
      text-align: center;
      color: var(--muted);
      background: #faf7f1;
      border-radius: 18px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a class="back-link" href="./index.html">返回总览</a>
      <span class="meta-pill">最近更新：2026-08-05</span>
    </div>
    <section class="page-title">
      <h1>德国</h1>
      <p>西南欧线下市场marketing追踪底表</p>
    </section>
    <nav class="month-nav">
        <a class="month-chip" href="#2026-09">
          <span>2026年9月</span>
          <strong>0</strong>
        </a>
      </nav>
    
        <section class="month-section" id="2026-09">
          <div class="month-header">
            <div>
              <h2>2026年9月</h2>
              <p>当前还没有录入记录</p>

              <span>已谈下/已发布：0</span>

        </section>
      
  </div>
</body>
